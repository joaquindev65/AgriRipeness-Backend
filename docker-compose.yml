services:
  db:
    container_name: agriripeness_db
    image: postgres:16.8-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:-agriripeness_db}
      POSTGRES_USER: ${DB_USER:-agriripeness_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agriripeness_pass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-agriripeness_user} -d ${DB_NAME:-agriripeness_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agriripeness_network

  redis:
    container_name: agriripeness_redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agriripeness_network

  web:
    container_name: agriripeness_web
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    environment:
      DEBUG: ${DEBUG:-False}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Se requiere DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@agriripeness.local}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@agriripeness.local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py create_superuser_if_missing &&
        gunicorn agriripeness_api.wsgi:application --bind 0.0.0.0:8000 --workers 2 --log-file - --access-logfile -
      "
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agriripeness_network

networks:
  agriripeness_network:
    driver: bridge

volumes:
  pgdata:
    name: agriripeness_pgdata
  redisdata:
    name: agriripeness_redisdata
  static_volume:
